<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #fff;
        }

        /* Navbar */

        .navbar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 20px 30px;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-right a {
            text-decoration: none;
            color: #202124;
            font-size: 14px;
        }

        .nav-right a:hover {
            text-decoration: underline;
        }

        .apps {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 20px;
        }

        .apps:hover {
            background: #f0f0f0;
        }

        .profile {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: #7b1fa2;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            cursor: pointer;
        }

        /* Main */

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-top: -90px;
        }

        /* Logo */

        .logo {
            font-size: 92px;
            font-weight: 500;
            margin-bottom: 28px;
            letter-spacing: -5px;
        }

        .blue {
            color: #4285F4;
        }

        .red {
            color: #EA4335;
        }

        .yellow {
            color: #FBBC05;
        }

        .green {
            color: #34A853;
        }

        /* Search Bar */

        .search-container {
            width: 585px;
            max-width: 92%;
        }

        .search-box {
            width: 100%;
            height: 48px;
            border: 1px solid #dfe1e5;
            border-radius: 24px;
            display: flex;
            align-items: center;
            padding: 0 18px;
            transition: 0.2s;
            background: #fff;
        }

        .search-box:hover {
            box-shadow:
                0 1px 6px rgba(32, 33, 36, .28);
            border-color: rgba(223, 225, 229, 0);
        }

        .search-box:focus-within {
            box-shadow:
                0 1px 6px rgba(32, 33, 36, .28);
            border-color: rgba(223, 225, 229, 0);
        }

        .search-icon {
            color: #9aa0a6;
            font-size: 16px;
            margin-right: 14px;
        }

        .search-input {
            flex: 1;
            height: 100%;
            border: none;
            outline: none;
            font-size: 16px;
            color: #202124;
        }

        .search-right {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 18px;
            cursor: pointer;
        }

        /* Buttons */

        .buttons {
            margin-top: 30px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .buttons button {
            background: #f8f9fa;
            border: 1px solid #f8f9fa;
            border-radius: 4px;
            color: #3c4043;
            font-size: 14px;
            padding: 10px 18px;
            cursor: pointer;
        }

        .buttons button:hover {
            border: 1px solid #dadce0;
            box-shadow: 0 1px 1px rgba(0, 0, 0, .1);
        }

        /* Language */

        .language {
            margin-top: 28px;
            font-size: 14px;
            color: #4d5156;
            text-align: center;
        }

        .language a {
            text-decoration: none;
            margin: 0 5px;
            color: #1a0dab;
        }

        .language a:hover {
            text-decoration: underline;
        }

        /* Footer */

        footer {
            background: #f2f2f2;
        }

        .footer-top {
            padding: 15px 30px;
            border-bottom: 1px solid #dadce0;
            color: #70757a;
            font-size: 15px;
        }

        .footer-bottom {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            padding: 15px 30px;
            gap: 15px;
        }

        .footer-left,
        .footer-right {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .footer-bottom a {
            text-decoration: none;
            color: #70757a;
            font-size: 14px;
        }

        .footer-bottom a:hover {
            text-decoration: underline;
        }

        /* Mobile */

        @media(max-width:600px) {

            .logo {
                font-size: 65px;
            }

            .search-box {
                height: 45px;
            }

            .footer-bottom {
                flex-direction: column;
                align-items: center;
            }

        }
    </style>
</head>

<body>

    <!-- Navbar -->

    <header class="navbar">

        <div class="nav-right">

            <a href="https://mail.google.com" target="_blank">
                Gmail
            </a>

            <a href="https://images.google.com" target="_blank">
                Images
            </a>

            <div class="apps">⋮</div>

            <div class="profile">R</div>

        </div>

    </header>

    <!-- Main -->

    <main class="main">

        <!-- Logo -->

        <h1 class="logo">

            <span class="blue">G</span>
            <span class="red">o</span>
            <span class="yellow">o</span>
            <span class="blue">g</span>
            <span class="green">l</span>
            <span class="red">e</span>

        </h1>

        <!-- Search -->

        <div class="search-container">

            <div class="search-box">

                <div class="search-icon">
                    🔍
                </div>

                <input type="text" id="searchInput" class="search-input" autocomplete="off">

                <div class="search-right">
                    🎤 📷
                </div>

            </div>

        </div>

        <!-- Buttons -->

        <div class="buttons">

            <button onclick="searchGoogle()">
                Google Search
            </button>

            <button onclick="feelingLucky()">
                I'm Feeling Lucky
            </button>

        </div>

        <!-- Languages -->

        <p class="language">

            Google offered in:

            <a href="#">हिन्दी</a>
            <a href="#">తెలుగు</a>
            <a href="#">தமிழ்</a>
            <a href="#">ಕನ್ನಡ</a>

        </p>

    </main>

    <!-- Footer -->

    <footer>

        <div class="footer-top">
            India
        </div>

        <div class="footer-bottom">

            <div class="footer-left">

                <a href="#">About</a>
                <a href="#">Advertising</a>
                <a href="#">Business</a>
                <a href="#">How Search works</a>

            </div>

            <div class="footer-right">

                <a href="#">Privacy</a>
                <a href="#">Terms</a>
                <a href="#">Settings</a>

            </div>

        </div>

    </footer>

    <!-- JavaScript -->

    <script>

        function searchGoogle() {

            let query =
                document.getElementById("searchInput").value;

            if (query !== "") {

                window.open(
                    "https://www.google.com/search?q=" + query,
                    "_blank"
                );

            }

        }

        function feelingLucky() {

            let query =
                document.getElementById("searchInput").value;

            if (query !== "") {

                window.open(
                    "https://www.google.com/search?btnI=I&q=" + query,
                    "_blank"
                );

            }

        }

        document
            .getElementById("searchInput")
            .addEventListener("keypress", function (event) {

                if (event.key === "Enter") {
                    searchGoogle();
                }

            });

    </script>

</body>

</html>
